name: build-and-push-pds

on:
  push:
    branches:
      - feat/configurable-actor-key-directory
  workflow_dispatch:

env:
  IMAGE_NAME: periwinkle/pds

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/pds/Dockerfile
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/pds-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pds-image
          path: /tmp/pds-image.tar
          retention-days: 1

  push-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pds-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/pds-image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PDS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push
        run: |
          SHA=${{ needs.build.outputs.short_sha }}
          docker tag $(docker images -q | head -1) \
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${SHA}
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${SHA}

  push-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pds-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/pds-image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PDS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push
        run: |
          SHA=${{ needs.build.outputs.short_sha }}
          docker tag $(docker images -q | head -1) \
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${SHA}
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${SHA}

  summary:
    needs: [build, push-dev, push-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## PDS Fork Image Built & Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ needs.build.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy, update \`pds_fork_image\` tag in the infra repo to \`${{ needs.build.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
